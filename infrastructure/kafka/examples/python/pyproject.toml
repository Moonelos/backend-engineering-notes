[project]
name = "kafka-notes-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.12,<3", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the disposable Kafka broker on localhost:9092"]
