services:
  redis:
    image: redis:7.4
    ports: ["127.0.0.1:57379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: advanced
      POSTGRES_USER: advanced
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:57432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advanced -d advanced"]
      interval: 1s
      timeout: 2s
      retries: 30
