apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: notes-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: calls
  namespace: safe-calls-lab
spec:
  gatewayClassName: notes-envoy
  listeners:
    - name: https
      hostname: api.example.test
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: calls-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calls
  namespace: safe-calls-lab
spec:
  parentRefs:
    - name: calls
  hostnames: [api.example.test]
  rules:
    - backendRefs:
        - name: calls
          port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calls
  namespace: safe-calls-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: calls}
  template:
    metadata:
      labels: {app: calls}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: safe-calls:lab
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            initialDelaySeconds: 5
          lifecycle:
            preStop:
              exec:
                command: [python, '-c', 'import time; time.sleep(5)']
---
apiVersion: v1
kind: Service
metadata:
  name: calls
  namespace: safe-calls-lab
spec:
  selector: {app: calls}
  ports:
    - port: 8000
      targetPort: 8000
